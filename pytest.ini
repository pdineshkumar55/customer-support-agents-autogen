[pytest]
testpaths = test_log.py test_kb.py test_team.py
markers =
    needs_openai: calls the OpenAI API (skipped when OPENAI_API_KEY is not set)
    llm: runs the full agent team with an LLM (slow, costs tokens); deselect with -m "not llm"
filterwarnings =
    ignore:Pydantic serializer warnings:UserWarning
